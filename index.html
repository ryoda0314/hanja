<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#fcfbf8" />
    <meta name="description" content="覚えた韓国語を、漢字の根でつなぐ。韓国語の漢字語を打って集めると、漢字に分かれて前の語とつながり、集めた字だけで読める語が見つかる。" />
    <!-- リンクを貼ったときのカード（X・LINE など）。絵は scripts/og/render.mjs で作る。絶対 URL が要るので、公開先を .env の VITE_SITE_URL に。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ことのね" />
    <meta property="og:title" content="ことのね — 覚えた韓国語を、漢字の根でつなぐ" />
    <meta property="og:description" content="학생 を打つと 學生 に分かれて、前に覚えた語とつながり、習っていない語まで読めるようになる。日本語を話す人のための、韓国語の漢字語アプリ。" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ことのね：학생 が 学 と 生 に分かれ、同じ 学 で 대학・학교 とつながる" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500&family=Noto+Serif+JP:wght@500&family=Shippori+Mincho:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>ことのね</title>
  </head>
  <body>
    <div class="status-fill" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<!-- 使われ方の数の画像・積もった版（1200×675、X に貼る横長）。集めた語の数だけ点を打ち、下になだらかな山にして積もらせる
     （点ひとつが語ひとつ）。点の色は アプリの Sprout の葉（わかば・そら）。stats.mjs が、いまの数とアイコンを差し込んで写す。
     並びは毎回同じ（種を決めた乱数）。 -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; width: 1200px; height: 675px; background: #fcfbf8; color: #172033; font-family: "IBM Plex Sans JP", sans-serif; overflow: hidden; }
      body { position: relative; }
      canvas { position: absolute; left: 0; top: 0; }
      .brand { position: absolute; left: 80px; top: 56px; display: flex; align-items: center; gap: 14px; }
      .brand img { display: block; box-sizing: border-box; width: 56px; height: 56px; border: 1.5px solid #e4e7ec; border-radius: 13px; }
      .name { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 36px; letter-spacing: 0.08em; }
      .side { position: absolute; right: 80px; top: 60px; margin: 0; text-align: right; font-size: 18px; line-height: 1.8; color: #5c6578; font-variant-numeric: tabular-nums; }
      .side b { font-weight: 500; color: #172033; }
      .main { position: absolute; left: 80px; top: 158px; }
      .label { margin: 0; font-size: 24px; color: #3b4558; }
      .hero { margin: 0; font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 120px; line-height: 1.08; color: #0f7a50; white-space: nowrap; }
      .hero small { margin-left: 8px; font-size: 42px; color: #172033; }
      .note { margin: 4px 0 0; font-size: 20px; color: #3b4558; }
      .tag { margin: 22px 0 0; font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 26px; letter-spacing: 0.03em; }
    </style>
  </head>
  <body>
    <canvas id="pile" width="1200" height="675" style="width: 1200px; height: 675px"></canvas>
    <div class="brand">{{ICON}}<span class="name">ことのね</span></div>
    <p class="side">{{URL}}<br />{{RANGE}}<br />漢字から、ハングルで読めた <b>{{READS}}</b> 回<br />使ってくれた端末 <b>{{DEVICES}}</b> 台</p>
    <div class="main">
      <p class="label">みんなで集めた、韓国語の漢字語</p>
      <p class="hero">{{WORDS}}<small>語</small></p>
      <p class="note">下に積もった点のひとつひとつが、集められた語。</p>
      <p class="tag">覚えた韓国語を、漢字の根でつなぐ。</p>
    </div>
    <script>
      // 点の数＝集めた語の数。下に一つのなだらかな山（両端は地面まで下がり、峰は右寄り）を描き、その中に揺らした方眼で点を置く。
      // 上の縁の近くは点をまばらにして、粉が積もったような柔らかい縁にする。方眼の目は、点が全部入るいちばん粗い細かさ。
      // 余った所は乱数で間引いて、ちょうど N にする。
      const N = {{WORDS_RAW}};
      const W = 1200, BASE = 652, X0 = 40, X1 = 1160, PEAK = 320, SOFT = 16;

      // 種を決めた乱数（mulberry32）。毎回同じ並びになる。
      const random = (s) => () => {
        s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const rand = random(20261026);

      // 山の上の縁（x での高さ）。
      const height = (x) => {
        const u = (x - X0) / (X1 - X0);
        return u <= 0 || u >= 1 ? 0 : PEAK * Math.sin(Math.PI * u * u) ** 0.9;
      };

      // 目の細かさごとに同じ種から揺らす（同じ細かさなら、何度数えても同じ点）。
      const cells = (p) => {
        const r = random(7);
        const out = [];
        for (let y = BASE - p / 2; y > BASE - PEAK - p; y -= p)
          for (let x = X0 + p / 2; x < X1; x += p) {
            const jx = x + (r() - 0.5) * p * 0.8;
            const jy = y + (r() - 0.5) * p * 0.8;
            const depth = jy - (BASE - height(jx));
            const keep = r();
            if (depth > 0 && jy < BASE && keep < Math.min(1, depth / SOFT)) out.push([jx, jy]);
          }
        return out;
      };
      let lo = 0.5, hi = 10;
      for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        if (cells(mid).length >= N) lo = mid;
        else hi = mid;
      }
      const pitch = lo;
      const list = cells(pitch);
      // ちょうど N に（乱数で間引く）。
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      list.length = Math.min(N, list.length);

      // 葉の色（Sprout と同じ わかば・そら）。下ほど濃く、上ほど淡い。
      const deep = ["#0f7a50", "#2fb67c", "#2fb67c", "#4ea7fd"];
      const pale = ["#7fd3ad", "#b6ead2", "#9ccafe", "#2fb67c"];
      const canvas = document.getElementById("pile");
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = 675 * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      for (const [x, y] of list) {
        const k = (BASE - y) / PEAK;
        const set = rand() < 0.2 + k * 0.65 ? pale : deep;
        ctx.fillStyle = set[Math.floor(rand() * set.length)];
        ctx.globalAlpha = 0.6 + rand() * 0.35;
        ctx.beginPath();
        ctx.arc(x, y, pitch * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }
      document.body.dataset.dots = list.length;
      document.body.dataset.pitch = pitch.toFixed(2);
    </script>
  </body>
</html>
